
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Maths Score Prediction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            padding: 30px;
        }
        .container {
            max-width: 550px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #0001;
        }
        h1 { text-align: center; color: #253858; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input, select, button {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        button {
            margin-top: 25px;
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }
        .result {
            margin-top: 25px;
            text-align: center;
            color: #166534;
            font-size: 22px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Student Maths Score Prediction</h1>

        <form action="/predictdata" method="POST">
            <label>Gender</label>
            <select name="gender" required>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>

            <label>Race / Ethnicity</label>
            <select name="ethnicity" required>
                <option value="group A">Group A</option>
                <option value="group B">Group B</option>
                <option value="group C">Group C</option>
                <option value="group D">Group D</option>
                <option value="group E">Group E</option>
            </select>

            <label>Parental Level of Education</label>
            <select name="parental_level_of_education" required>
                <option value="some high school">Some High School</option>
                <option value="high school">High School</option>
                <option value="some college">Some College</option>
                <option value="associate's degree">Associate's Degree</option>
                <option value="bachelor's degree">Bachelor's Degree</option>
                <option value="master's degree">Master's Degree</option>
            </select>

            <label>Lunch Type</label>
            <select name="lunch" required>
                <option value="standard">Standard</option>
                <option value="free/reduced">Free / Reduced</option>
            </select>

            <label>Test Preparation Course</label>
            <select name="test_preparation_course" required>
                <option value="none">None</option>
                <option value="completed">Completed</option>
            </select>

            <label>Reading Score</label>
            <input type="number" name="reading_score"
                   min="0" max="100" required>

            <label>Writing Score</label>
            <input type="number" name="writing_score"
                   min="0" max="100" required>

            <button type="submit">Predict Maths Score</button>
        </form>

        {% if results is defined %}
        <div class="result">
            Predicted Maths Score: {{ results }}
        </div>
        {% endif %}
    </div>
</body>
</html>
